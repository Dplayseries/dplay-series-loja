<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPlay | Pagamento</title><style>*{box-sizing:border-box}body{background:radial-gradient(circle at top,#33215a,#090b1e 70%);color:white;font:16px system-ui;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#191b37;border:1px solid #7545bc;border-radius:22px;padding:26px;max-width:450px;width:100%;box-shadow:0 20px 50px #0007}h1{font-size:24px;margin-top:0}.price{font-size:36px;font-weight:900;color:#f55acb}.muted{color:#c8c6df;line-height:1.6}.btn{display:block;background:linear-gradient(90deg,#276fff,#e42bc8);color:white;text-align:center;border-radius:12px;padding:15px;text-decoration:none;font-weight:800;margin-top:22px}.state{background:#272944;padding:16px;border-radius:12px;margin-top:20px}a{color:white}</style></head><body><main class="card"><h1>🎬 DPlay Series</h1><h2 id="nome">A Filha Esquecida do Don</h2><div class="price">R$ 4,00</div><p class="muted">Seu pedido está vinculado à sua conta do Telegram.</p><div id="estado" class="state" role="status">Consultando pedido...</div><p class="muted">O Pix será exibido aqui após a ativação segura do checkout. Nenhuma cobrança é gerada nesta versão.</p><a class="btn" href="https://t.me/DPlayEpisodiosBot">Voltar ao bot</a></main><script>const token=new URLSearchParams(location.search).get('token');const estado=document.getElementById('estado');if(!token){estado.textContent='Link incompleto. Abra a compra pelo bot.';}else{fetch('https://dplay-series-api.onrender.com/checkout/pedido?token='+encodeURIComponent(token)).then(async r=>{if(!r.ok)throw Error('Link expirado ou pedido indisponível. Volte ao bot.');return r.json()}).then(d=>{document.getElementById('nome').textContent=d.produto;estado.textContent=d.status==='aprovado'?'Pagamento aprovado. Confira seu Telegram.':'⏳ Pedido registrado. Pix em preparação.'}).catch(e=>estado.textContent=e.message)}</script></body></html>
