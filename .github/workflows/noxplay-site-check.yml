name: NoxPlay storefront checks
on:
  push:
    branches: [feature/noxplay-multiloja]
    paths:
      - 'noxplay-site/**'
      - '.github/workflows/noxplay-site-check.yml'
  pull_request:
    paths:
      - 'noxplay-site/**'
      - '.github/workflows/noxplay-site-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify checkout JavaScript
        run: node --check noxplay-site/checkout.js
      - name: Verify inline storefront JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("noxplay-site/index.html").read_text()
          tags = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", text)
          inline = [s for s in tags if s.strip()]
          assert len(inline) == 1
          Path("/tmp/noxplay-inline.js").write_text(inline[0])
          PY
          node --check /tmp/noxplay-inline.js
      - name: Confirm checkout is gated by readiness
        run: |
          grep -q 'NoxCheckout.initialize' noxplay-site/index.html
          grep -q 'checkout_habilitado === true' noxplay-site/checkout.js
