name: Loja JavaScript
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser scripts
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          for(const path of ['index.html','streaming.html','carteira.html','checkout.html']){
            const html=fs.readFileSync(path,'utf8');
            const scripts=[...html.matchAll(new RegExp('<script[^>]*>([^]*?)</script>','g'))];
            if(!scripts.length)throw new Error('No scripts found: '+path);
            for(const match of scripts)new vm.Script(match[1],{filename:path});
            console.log(path+': scripts validos');
          }
          new vm.Script(fs.readFileSync('wallet.js','utf8'),{filename:'wallet.js'});
          NODE
      - name: Simulate payment and delivery states
        run: node tests/access-flow.cjs
      - name: Preserve existing wallet series links
        run: node tests/wallet-catalog.cjs
      - name: Prevent stale checkout responses
        run: node tests/checkout-race.cjs
      - name: Search previews and title ranking
        run: node --test tests/title-search.cjs


