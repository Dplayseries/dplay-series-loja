<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#090b1e"><title>DPlay | Minha série</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 40% -10%,#3f2378,#090b1e 55%);color:#faf8ff;font:16px system-ui;min-height:100vh}header{border-bottom:1px solid #40345b;padding:20px 24px}main{max-width:960px;margin:auto;padding:38px 24px}h1{font-size:clamp(28px,6vw,48px);margin:14px 0}p{line-height:1.6;color:#cbc4df}.tag{border:1px solid #8352c5;background:#432568;border-radius:999px;padding:7px 12px;font-size:13px}.panel{border:1px solid #4e3c70;background:#1b1733;padding:24px;border-radius:18px;margin:24px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}.button,button{display:inline-block;background:#8850ea;color:white;padding:13px 18px;border:0;border-radius:12px;font:700 15px system-ui;text-decoration:none;cursor:pointer}.secondary{border:1px solid #8e6dbd;background:transparent}a{color:#dcb8ff}.episodes{display:grid;gap:12px;margin-top:20px}.episode{text-align:left;width:100%}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}small{color:#c8b8df}button:disabled{opacity:.5}#player:empty{display:none}
</style></head><body><header><strong>DPlay Series</strong></header><main>
<span class="tag" id="badge">Seu acesso DPlay</span><h1 id="title">Minhas séries</h1>
<p id="status" role="status">Consultando seu acesso...</p>
<section class="panel"><div id="player"></div><div id="episodes" class="episodes"></div><div id="purchases"></div></section>
<div class="actions"><a class="button secondary" href="./index.html">Voltar à loja</a><a class="button secondary" id="telegram" href="https://t.me/DPlayEpisodiosBot">Abrir no Telegram</a><button id="save" class="secondary" hidden>Copiar meu link de acesso</button></div>
<p><small>O mesmo pedido mantém seu acesso. Quando uma opção estiver indisponível, use a alternativa liberada para sua série. Guarde seu link de compra e não o compartilhe.</small></p>
</main><script>
(async function(){
'use strict';
const API='https://dplay-series-api.onrender.com';
const status=document.getElementById('status'), episodes=document.getElementById('episodes'), player=document.getElementById('player');
const fragment=new URLSearchParams(location.hash.slice(1));
const receipt={pedido_id:fragment.get('pedido'),resgate:fragment.get('resgate')};
let initData='';
async function request(path,body){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{
  const headers=body?{'Content-Type':'application/json'}:{'X-Telegram-Init-Data':initData};
  const response=await fetch(API+path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined,cache:'no-store',signal:controller.signal});
  const data=await response.json();
  if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'Não foi possível consultar seu acesso.');
  return data;
 }finally{clearTimeout(timer);}
}
function renderEpisodes(items,play){
 episodes.replaceChildren();player.replaceChildren();
 if(!items.length){status.textContent='Sua compra foi localizada. O vídeo ainda não está disponível na nuvem; use a opção Telegram.';return;}
 for(const item of items){
  const button=document.createElement('button');button.className='episode';button.textContent='▶ '+String(item.titulo||item.chave||'Assistir');
  button.addEventListener('click',async()=>{
   button.disabled=true;status.textContent='Abrindo o vídeo...';
   try{
    const data=await play(item.chave),url=new URL(data.url);
    if(url.origin!=='https://player.mediadelivery.net'||!url.pathname.startsWith('/embed/'))throw new Error('Player indisponível.');
    const frame=document.createElement('iframe');frame.src=url.href;frame.title=String(item.titulo||'Série DPlay');
    frame.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';
    player.replaceChildren(frame);status.textContent='Sua série está liberada na nuvem.';frame.scrollIntoView({behavior:'smooth',block:'center'});
   }catch(error){status.textContent=error.message||'Vídeo indisponível. Tente a opção Telegram.';}
   finally{button.disabled=false;}
  });
  episodes.append(button);
 }
 status.textContent='Pagamento confirmado. Escolha o vídeo para assistir.';
 document.getElementById('badge').textContent='Acesso liberado';
}
try{
 if(receipt.pedido_id&&receipt.resgate){
  const data=await request('/streaming/compra',receipt);
  document.getElementById('title').textContent=String(data.titulo||'Minha série');
  document.getElementById('telegram').href=data.telegram_url;
  renderEpisodes(data.episodios||[],key=>request('/streaming/compra/play',{...receipt,episodio_chave:key}));
  const save=document.getElementById('save');save.hidden=false;
  save.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);save.textContent='Link copiado';}catch{status.textContent='Guarde o endereço desta página para acessar novamente.';}});
  return;
 }
 await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://telegram.org/js/telegram-web-app.js';script.onload=resolve;script.onerror=reject;document.head.append(script);});
 initData=window.Telegram?.WebApp?.initData||'';
 if(!initData){status.textContent='Abra o link recebido após o pagamento ou toque em Minhas Séries no bot Telegram.';return;}
 window.Telegram.WebApp.ready();
 const library=await request('/streaming/minha-biblioteca');
 if(!library.series?.length){status.textContent='Nenhuma compra aprovada foi encontrada nesta conta.';return;}
 status.textContent='Selecione uma das suas séries.';
 for(const item of library.series){
  const button=document.createElement('button');button.className='episode';button.textContent=String(item.titulo||'Série');
  button.addEventListener('click',async()=>{
   button.disabled=true;
   try{
    const data=await request('/streaming/episodios/'+encodeURIComponent(item.id));
    document.getElementById('title').textContent=String(item.titulo);
    renderEpisodes(data.episodios||[],key=>request('/streaming/play/'+encodeURIComponent(item.id)+'/'+encodeURIComponent(key)));
   }catch(error){status.textContent=error.message;}
   finally{button.disabled=false;}
  });
  document.getElementById('purchases').append(button);
 }
}catch(error){status.textContent=error.message||'Não foi possível abrir sua série agora. Seu pedido continua registrado.';}
})();
</script></body></html>
